name: Validate

on: pull_request

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x

      - name: Resolve library project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(EBay.*/EBay.*.csproj)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "expected exactly one EBay.*/EBay.*.csproj, found ${#projects[@]}: ${projects[*]:-<none>}" >&2
            exit 1
          fi
          echo "validating ${projects[0]}"
          echo "path=${projects[0]}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.project.outputs.path }}" --no-restore

      - name: Static analysis
        run: ./scripts/analyze
