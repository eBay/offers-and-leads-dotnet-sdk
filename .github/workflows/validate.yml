name: Validate

on: pull_request

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve library project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(EBay.*/EBay.*.csproj)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "expected exactly one EBay.*/EBay.*.csproj, found ${#projects[@]}: ${projects[*]:-<none>}" >&2
            exit 1
          fi
          echo "validating ${projects[0]}"
          echo "path=${projects[0]}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.path }}" -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build "${{ steps.project.outputs.path }}" --no-restore -f ${{ matrix.framework }}

      - name: Static analysis
        run: ./scripts/analyze ${{ matrix.framework }}
