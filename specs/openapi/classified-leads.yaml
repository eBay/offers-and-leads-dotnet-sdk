---
openapi: "3.0.0"
info:
  title: "Classified Leads API"
  description: "The <b>Leads API</b> lets sellers return leads generated by their\
    \ classified ad listings and includes any contact information that prospective\
    \ buyers have submitted. A seller can retrieve leads for listed items for a specified\
    \ marketplace optionally filtered by specified search criteria. Use this resource\
    \ to retrieve sales-lead information for classified ad listings. For additional\
    \ information on classified adds, see <a href=\"https://www.ebay.com/help/selling/listings/listing-tips/selling-classified-ads?id=4167\"\
    \ target=\"_blank\">Selling with Classified Ads</a>.<p>The <b>getClassifiedLeadsByItemId</b>\
    \ method retrieves leads for a specific classified ad listing, while <b>getAllClassifiedLeads</b>\
    \ method retrieves leads for all active classified ad listings.</p><p><span class=\"\
    tablenote\"><b>Note:</b> This is a <a href=\"https://developer.ebay.com/api-docs/static/versioning.html#limited\"\
    \ target=\"_blank\"> <img src=\"/cms/img/docs/partners-api.svg\" class=\"legend-icon\
    \ partners-icon\" title=\"Limited Release\"  alt=\"Limited Release\" />(Limited\
    \ Release)</a> API available only to select developers approved by business units.\
    \ For information on how to obtain access to this API in production, please contact\
    \ eBay support.</span></p>"
  contact:
    name: "eBay Inc,"
  license:
    name: "eBay API License Agreement"
    url: "https://developer.ebay.com/join/api-license-agreement"
  version: "v1.0.0"
servers:
- url: "https://apiz.ebay.com{basePath}"
  description: "Production"
  variables:
    basePath:
      default: "/sell/leads/v1"
paths:
  /classified_lead:
    get:
      tags:
      - "classified_lead"
      description: "This method retrieves leads for all of the seller's active classified\
        \ ad listings. Optionally, just those matching specified filter criteria can\
        \ be returned.<p><span class=\"tablenote\"><b>Note:</b> This is a <a href=\"\
        https://developer.ebay.com/api-docs/static/versioning.html#limited\" target=\"\
        _blank\"> <img src=\"/cms/img/docs/partners-api.svg\" class=\"legend-icon\
        \ partners-icon\" title=\"Limited Release\"  alt=\"Limited Release\" />(Limited\
        \ Release)</a> API available only to select developers approved by business\
        \ units. For information on how to obtain access to this API in production,\
        \ please contact eBay support.</span></p>"
      operationId: "getAllClassifiedLeads"
      parameters:
      - name: "endTime"
        in: "query"
        description: "Use with <b>startTime</b> to limit the returned leads for the\
          \ user. Only leads with a creation date less than or equal to the specified\
          \ date and time will be returned.<p><span class=\"tablenote\"><span style=\"\
          color:#004680\"><strong>Note: </strong>The <b>startTime</b> and <b>endTime</b>\
          \ fields can be used independently to filter results.</span></p>The time\
          \ stamp must be formatted as an <a href=\"https://www.iso.org/iso-8601-date-and-time-format.html\"\
          \ target=\"_blank\">ISO 8601</a> string, which is based on the 24-hour Universal\
          \ Coordinated Time (UTC) clock.<br><br><b>Format:</b> <code>[YYYY]-[MM]-[DD]T[hh]:[mm]:[SS]Z</code>\
          \ <br><b>Example:</b>  <code>2025-01-10T15:54:00Z</code>"
        required: false
        schema:
          type: "string"
      - name: "includeMessages"
        in: "query"
        description: "Boolean that indicates whether to return mail messages for this\
          \ lead in a <b>memberMessage</b> container (<code>true</code> returns messages).\
          \ If omitted, no messages for this lead will be returned (same as when set\
          \ to <code>false</code>).<p><b>Default: </b>false<p>"
        required: false
        schema:
          type: "string"
      - name: "startTime"
        in: "query"
        description: "Use with <b>endTime</b> to limit the returned leads for the\
          \ user. Only leads for active listings with a creation date greater than\
          \ or equal to the specified date and time will be returned. <p><span class=\"\
          tablenote\"><span style=\"color:#004680\"><strong>Note: </strong>The <b>startTime</b>\
          \ and <b>endTime</b> fields can be used independently to filter results.</span></p>The\
          \ time stamp must be formatted as an <a href=\"https://www.iso.org/iso-8601-date-and-time-format.html\"\
          \ target=\"_blank\">ISO 8601</a> string, which is based on the 24-hour Universal\
          \ Coordinated Time (UTC) clock.<br><br><b>Format:</b> <code>[YYYY]-[MM]-[DD]T[hh]:[mm]:[SS]Z</code>\
          \ <br><b>Example:</b>  <code>2025-01-10T15:54:00Z</code>"
        required: false
        schema:
          type: "string"
      - name: "status"
        in: "query"
        description: "The enumeration value in this field will indicate whether or\
          \ not a question has been answered. Valid values include: <br><ul><li><code>Answered</code></li>\
          \ <li><code>Unanswered</code></li></ul>"
        required: false
        schema:
          type: "string"
      - name: "Content-Type"
        in: "header"
        description: "This header indicates the format of the request body provided\
          \ by the client. Its value should be set to <b>application/json</b>. <br><br>\
          \ For more information, refer to <a href=\"/api-docs/static/rest-request-components.html#HTTP\"\
          \ target=\"_blank \">HTTP request headers</a>."
        required: true
        schema:
          type: "string"
      - name: "Accept-Encoding"
        in: "header"
        description: "This header indicates the compression-encoding algorithms the\
          \ client accepts for the response. This value should be set to <code>gzip</code>.\
          \ <br><br> For more information, refer to <a href=\"/api-docs/static/rest-request-components.html#HTTP\"\
          \ target=\"_blank \">HTTP request headers</a>."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifiedLeadsListResponse"
        "400":
          description: "Bad Request"
          x-response-codes:
            errors:
              352005:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid Date Range. End time should be greater than\
                  \ start time."
              352004:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid Date. Date has to be in the past."
              352007:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid value for includeMessages. Please provide a\
                  \ valid boolean value (true/false)."
              352006:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid status. Please provide a valid status value\
                  \ (Answered/Unanswered)."
              352003:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid UTC Time. Please provide a valid UTC time in\
                  \ the format YYYY-MM-DDTHH:MM:SSZ."
        "500":
          description: "Internal Server Error"
          x-response-codes:
            errors:
              350000:
                domain: "API_LEADS"
                category: "APPLICATION"
                description: "There was a problem with an eBay internal system or\
                  \ process. Contact eBay developer support for assistance."
        "401":
          description: "Unauthorized"
        "204":
          description: "No Content"
      security:
      - api_auth:
        - "https://api.ebay.com/oauth/api_scope/sell.leads"
  /classified_lead/{itemId}:
    get:
      tags:
      - "classified_lead"
      description: "This method returns a seller account's leads generated by the\
        \ specified classified ad, and includes any contact information that prospective\
        \ buyers have submitted. Optionally, just those matching specified filter\
        \ criteria can be returned.<p><span class=\"tablenote\"><b>Note:</b> This\
        \ is a <a href=\"https://developer.ebay.com/api-docs/static/versioning.html#limited\"\
        \ target=\"_blank\"> <img src=\"/cms/img/docs/partners-api.svg\" class=\"\
        legend-icon partners-icon\" title=\"Limited Release\"  alt=\"Limited Release\"\
        \ />(Limited Release)</a> API available only to select developers approved\
        \ by business units. For information on how to obtain access to this API in\
        \ production, please contact eBay support.</span></p>"
      operationId: "getClassifiedLeadsByItemId"
      parameters:
      - name: "endTime"
        in: "query"
        description: "Use with <b>startTime</b> to limit the returned leads for the\
          \ user for active listings. Only leads with a creation date less than or\
          \ equal to the specified date and time will be returned. <p><span class=\"\
          tablenote\"><span style=\"color:#004680\"><strong>Note: </strong>The <b>startTime</b>\
          \ and <b>endTime</b> fields can be used independently to filter results.</span></p>The\
          \ time stamp must be formatted as an <a href=\"https://www.iso.org/iso-8601-date-and-time-format.html\"\
          \ target=\"_blank\">ISO 8601</a> string, which is based on the 24-hour Universal\
          \ Coordinated Time (UTC) clock. <br><br><b>Format:</b> <code>[YYYY]-[MM]-[DD]T[hh]:[mm]:[SS]Z</code>\
          \ <br><b>Example:</b>  <code>2025-01-10T15:54:00Z</code>"
        required: false
        schema:
          type: "string"
      - name: "includeMessages"
        in: "query"
        description: "Include this field and set it to true to retrieve any member\
          \ messages associated with leads in the <b>memberMessage</b> container (<code>true</code>\
          \ returns messages).<br><br><b>Default</b>: <code>true</code>"
        required: false
        schema:
          type: "string"
      - name: "itemId"
        in: "path"
        description: "The unique identifier of the listing."
        required: true
        schema:
          type: "string"
      - name: "startTime"
        in: "query"
        description: "Use with <b>endTime</b> to limit the returned leads for the\
          \ user. Only leads with a start time greater than or equal to the specified\
          \ date and time will be returned. <p><span class=\"tablenote\"><span style=\"\
          color:#004680\"><strong>Note: </strong>The <b>startTime</b> and <b>endTime</b>\
          \ fields can be used independently to filter results.</span></p>The time\
          \ stamp must be formatted as an <a href=\"https://www.iso.org/iso-8601-date-and-time-format.html\"\
          \ target=\"_blank\">ISO 8601</a> string, which is based on the 24-hour Universal\
          \ Coordinated Time (UTC) clock.<br><br><b>Format:</b> <code>[YYYY]-[MM]-[DD]T[hh]:[mm]:[SS]Z</code>\
          \ <br><b>Example:</b>  <code>2025-01-10T15:54:00Z</code>"
        required: false
        schema:
          type: "string"
      - name: "status"
        in: "query"
        description: "Include this field if you would only like to retrieve leads\
          \ where the buyer has answered questions or has not answered questions.\
          \ If not used, leads with answered questions and unanswered questions are\
          \ returned. Valid values include: <br><ul><li><code>Answered</code></li>\
          \ <li><code>Unanswered</code></li></ul>"
        required: false
        schema:
          type: "string"
      - name: "Content-Type"
        in: "header"
        description: "This header indicates the format of the request body provided\
          \ by the client. Its value should be set to <b>application/json</b>. <br><br>\
          \ For more information, refer to <a href=\"/api-docs/static/rest-request-components.html#HTTP\"\
          \ target=\"_blank \">HTTP request headers</a>."
        required: true
        schema:
          type: "string"
      - name: "Accept-Encoding"
        in: "header"
        description: "This header indicates the compression-encoding algorithms the\
          \ client accepts for the response. This value should be set to <code>gzip</code>.\
          \ <br><br> For more information, refer to <a href=\"/api-docs/static/rest-request-components.html#HTTP\"\
          \ target=\"_blank \">HTTP request headers</a>."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifiedLead"
        "400":
          description: "Bad Request"
          x-response-codes:
            errors:
              352005:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid Date Range. End time should be greater than\
                  \ start time."
              352004:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid Date. Date has to be in the past."
              352007:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid value for includeMessages. Please provide a\
                  \ valid boolean value (true/false)."
              352006:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid status. Please provide a valid status value\
                  \ (Answered/Unanswered)."
              352003:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid UTC Time. Please provide a valid UTC time in\
                  \ the format YYYY-MM-DDTHH:MM:SSZ."
              352002:
                domain: "API_LEADS"
                category: "REQUEST"
                description: "Invalid Item ID. Please provide a valid item ID."
        "500":
          description: "Internal Server Error"
          x-response-codes:
            errors:
              350000:
                domain: "API_LEADS"
                category: "APPLICATION"
                description: "There was a problem with an eBay internal system or\
                  \ process. Contact eBay developer support for assistance."
        "401":
          description: "Unauthorized"
        "204":
          description: "No Content"
      security:
      - api_auth:
        - "https://api.ebay.com/oauth/api_scope/sell.leads"
components:
  schemas:
    Amount:
      type: "object"
      properties:
        convertedFromCurrency:
          type: "string"
          description: "A three-letter ISO 4217 code that indicates the currency of\
            \ the amount in the <b>convertedFromValue</b> field. This value is required\
            \ or returned only if currency conversion/localization is required, and\
            \ represents the pre-conversion currency."
        convertedFromValue:
          type: "string"
          description: "The monetary amount before any conversion is performed, in\
            \ the currency specified by the <b>convertedFromCurrency</b> field. This\
            \ value is required or returned only if currency conversion/localization\
            \ is required. The value field contains the converted amount of this value,\
            \ in the currency specified by the <b>currency</b> field."
        currency:
          type: "string"
          description: "A three-letter ISO 4217 code that indicates the currency of\
            \ the amount in the <b>value</b> field. If currency conversion/localization\
            \ is required, this is the post-conversion currency of the amount in the\
            \ <b>value</b> field."
        value:
          type: "string"
          description: "The monetary amount, in the currency specified by the <b>currency</b>\
            \ field. If currency conversion/localization is required, this value is\
            \ the converted amount, and the <b>convertedFromValue</b> field contains\
            \ the amount in the original currency."
      description: "This type provides monetary amount of the special fee."
    ClassifiedLead:
      type: "object"
      properties:
        itemId:
          type: "string"
          description: "The unique identifier of the listing."
        itemTitle:
          type: "string"
          description: "The title of the listing.<br><br><b>Max length:</b> 80."
        responses:
          type: "array"
          description: "An array of the classified lead responses."
          items:
            $ref: "#/components/schemas/ClassifiedLeadResponses"
      description: "This type contains the classified lead ID and other information."
    ClassifiedLeadResponses:
      type: "object"
      properties:
        additionalInformation:
          type: "string"
          description: "This field shows the first message that was sent from the\
            \ prospective buyer to the seller. This will be the same content as in\
            \ the <b>memberMessageExchange.question.body</b> field, if returned. <br><br><span\
            \ class=\"tablenote\"> <strong>Note:</strong> Retrieve the <b>memberMessageExchange</b>\
            \ container to retrieve the entire exchange between the seller and the\
            \ prospective buyer (all messages).</span>"
        contactInformation:
          description: "This container consists of contact information for the prospective\
            \ buyer. Fields in this container are returned if provided. This container\
            \ will not be returned if the buyer did not provide any contact information."
          $ref: "#/components/schemas/ContactInformation"
        email:
          type: "string"
          description: "Email address for the prospective buyer, if that buyer was\
            \ logged in to eBay."
        externalEmail:
          type: "string"
          description: "Email address for the prospective buyer as entered in the\
            \ lead form on the <b>View Item</b> page. Provides a way for sellers to\
            \ contact prospective buyers who choose not to log in to eBay. This applies\
            \ to only eBay Motors and eBay Motors categories."
        financingAnswer:
          type: "boolean"
          description: "Boolean that indicates if a prospective buyer answered whether\
            \ or not they would like financing. Entered on the lead form on the <b>View\
            \ Item</b> page. Applies to eBay Motors and Motors categories only."
        leadFee:
          description: "A container that returns the amount charged for this pay per\
            \ lead contact, in the item's site local currency."
          $ref: "#/components/schemas/LeadFee"
        leadStatus:
          type: "string"
          description: "The enumeration value in this field indicates whether or not\
            \ the seller has responded to the lead, or if this is new. For implementation\
            \ help, refer to <a href='https://developer.ebay.com/api-docs/sell/leads/types/api:LeadStatus'>eBay\
            \ API documentation</a>"
        memberMessage:
          description: "Contains any mail message content shared between the seller\
            \ and prospective buyer. <br><br>Only returned if the <b>includeMessages</b>\
            \ boolean is <code>true</code>."
          $ref: "#/components/schemas/MemberMessage"
        submittedTime:
          type: "string"
          description: "Date and time (in GMT) that the lead was submitted."
        tradeInMake:
          type: "string"
          description: "The make of the vehicle the prospective buyer would like to\
            \ trade in. Entered on the lead form on the <b>View Item</b> page. Applies\
            \ to eBay Motors and Motors categories only."
        tradeInModel:
          type: "string"
          description: "The model of the vehicle the prospective buyer would like\
            \ to trade in. Entered on the lead form on the <b>View Item</b> page.\
            \ Applies to eBay Motors and Motors categories only."
        tradeInYear:
          type: "string"
          description: "The year of the vehicle the prospective buyer would like to\
            \ trade in. Entered on the lead form on the <b>View Item</b> page. Applies\
            \ to eBay Motors and Motors categories only."
        userId:
          type: "string"
          description: "The eBay user ID of the user who is interested in the seller's\
            \ item."
      description: "This type provides classified lead responses including any contact\
        \ information that prospective buyers have submitted."
    ClassifiedLeadsListResponse:
      type: "object"
      properties:
        classifiedLeads:
          type: "array"
          description: "An array of leads for the seller's active classified ad listings."
          items:
            $ref: "#/components/schemas/ClassifiedLead"
        totalItems:
          type: "integer"
          description: "The total number of listings returned."
          format: "int32"
        totalLeads:
          type: "integer"
          description: "The total number of leads returned for all listings."
          format: "int32"
      description: "This type contains an array of for the seller's active classified\
        \ ad listings, the total number of items, and leads."
    ContactInformation:
      type: "object"
      properties:
        firstName:
          type: "string"
          description: "The first name of the prospective buyer."
        lastName:
          type: "string"
          description: "The last name of the prospective buyer."
        phone:
          type: "string"
          description: "The prospective buyer's primary phone number."
        postalCode:
          type: "string"
          description: "The prospective buyer's postal code."
      description: "This type consists of contact information for the prospective\
        \ buyer."
    Error:
      type: "object"
      properties:
        category:
          type: "string"
          description: "Identifies the type of erro."
        domain:
          type: "string"
          description: "Name for the primary system where the error occurred. This\
            \ is relevant for application errors."
        errorId:
          type: "integer"
          description: "A unique number to identify the error."
          format: "int32"
        inputRefIds:
          type: "array"
          description: "An array of request elements most closely associated to the\
            \ error."
          items:
            type: "string"
        longMessage:
          type: "string"
          description: "A more detailed explanation of the error."
        message:
          type: "string"
          description: "Information on how to correct the problem, in the end user's\
            \ terms and language where applicable."
        outputRefIds:
          type: "array"
          description: "An array of request elements most closely associated to the\
            \ error."
          items:
            type: "string"
        parameters:
          type: "array"
          description: "An array of name/value pairs that describe details the error\
            \ condition. These are useful when multiple errors are returned."
          items:
            $ref: "#/components/schemas/ErrorParameter"
        subdomain:
          type: "string"
          description: "Further helps indicate which subsystem the error is coming\
            \ from. System subcategories include: Initialization, Serialization, Security,\
            \ Monitoring, Rate Limiting, etc."
      description: "This type defines the fields that can be returned in an error."
    ErrorParameter:
      type: "object"
      properties:
        name:
          type: "string"
          description: "The object of the error."
        value:
          type: "string"
          description: "The value of the object."
    LeadFee:
      type: "object"
      properties:
        amount:
          description: "A container that returns the amount charged for the lead service\
            \ with currency information."
          $ref: "#/components/schemas/Amount"
        description:
          type: "string"
          description: "An explanation of the special fee charged."
      description: "This type returns the amount charged for the lead service."
    MemberMessage:
      type: "object"
      properties:
        memberMessageExchange:
          type: "array"
          description: "An array that provides detailed information about a member-to-member\
            \ message."
          items:
            $ref: "#/components/schemas/MemberMessageExchange"
      description: "This type defines the field containing any mail message content\
        \ shared between the seller and prospective buyer."
    MemberMessageExchange:
      type: "object"
      properties:
        creationDate:
          type: "string"
          description: "Date the message was created. Returned if the parent container\
            \ is returned."
        question:
          description: "Contains all the information about the question being asked.\
            \ Returned if the parent container is returned."
          $ref: "#/components/schemas/Question"
        response:
          type: "string"
          description: "An answer to the question. Contains the body of the seller's\
            \ response message, if sent."
      description: "This type defines the fields containing detailed information about\
        \ a member-to-member message."
    Question:
      type: "object"
      properties:
        body:
          type: "string"
          description: "Content of the message is input into this string field."
        messageID:
          type: "integer"
          description: "The unique identifier of the message."
          format: "int32"
      description: "Question"
  securitySchemes:
    api_auth:
      type: "oauth2"
      description: "The security definitions for this API. Please check individual\
        \ operations for applicable scopes."
      flows: {}
